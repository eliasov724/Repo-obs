global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'pacientes'
    static_configs:
      - targets: ['172.17.0.1:9001']
    metrics_path: '/actuator/prometheus'

  - job_name: 'turnos'
    static_configs:
      - targets: ['172.17.0.1:9002']
    metrics_path: '/actuator/prometheus'

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['172.17.0.1:8090']
    metrics_path: '/actuator/prometheus'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
