spring.application.name=api-gateway
server.port=8090

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=pacientes-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://pacientes
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/pacientes/**

spring.cloud.gateway.server.webflux.routes[1].id=turnos-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://turnos
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/turnos/**

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.metrics.tags.application=${spring.application.name}
