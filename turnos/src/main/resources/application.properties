spring.application.name=turnos
server.port=9002

spring.datasource.url=jdbc:mysql://localhost:3306/turnos_db
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# URL base del microservicio pacientes, para usar con RestTemplate
pacientes.api.url=http://localhost:9001
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/


# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.pacientesService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pacientesService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.pacientesService.permitted-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.pacientesService.sliding-window-size=10

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.metrics.tags.application=${spring.application.name}
